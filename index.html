<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>成成的工作台</title><link rel="stylesheet" href="styles.css"></head>
<body><div id="app">
<nav class="rail"><div class="logo">成</div><button data-tab="project" title="项目">▣</button><button data-tab="assets" title="资产">◇</button><button data-tab="tasks" title="任务">≡</button><span></span><button id="settings" title="模型 API">⚙</button></nav>
<header><div><strong>成成的工作台</strong><small>自由搭建你的 AI 视频流水线</small></div><div class="header-actions"><span id="status">V6 · 本地自动保存</span><button id="import">导入</button><button id="export">导出</button><button class="primary" id="runAll">▶ 运行全部</button></div></header>
<aside class="left"><div class="tabs"><button class="on" data-tab="project">项目</button><button data-tab="assets">资产</button><button data-tab="tasks">任务</button></div>
  <section id="projectPanel"><label>项目名称<input id="projectName" value="未命名视频项目"></label><label>创意<textarea id="idea" placeholder="输入你的视频想法……"></textarea></label><div class="row"><label>集数<input id="episodes" type="number" min="1" value="1"></label><label>时长<input id="duration" value="3分钟"></label></div></section>
  <section id="assetsPanel" hidden><div class="panel-title">角色参考图 <button id="addAsset">＋</button></div><div id="assetList" class="asset-list"></div></section>
  <section id="tasksPanel" hidden><div class="panel-title">任务状态</div><div id="taskList"></div></section>
</aside>
<main><div class="toolbar"><button id="addNode" class="primary">＋ 添加节点</button><button id="deleteNode">删除节点</button><button id="clearCanvas">清空画布</button><span></span><button id="zoomOut">−</button><b id="zoomText">100%</b><button id="zoomIn">＋</button></div><div id="canvasWrap"><svg id="wires"></svg><div id="canvas"></div><div class="hint">拖动节点标题移动 · 滚轮缩放 · 点击输出端口再点击输入端口连线</div></div></main>
<aside class="right" id="inspector"><div id="emptyInspect">选择一个节点后在这里编辑</div><div id="nodeEditor" hidden><div class="eyebrow" id="nodeType"></div><h2 id="nodeTitle"></h2><label>节点名称<input id="nodeName"></label><label>平台<select id="provider"></select></label><label>模型<div class="inline"><select id="model"></select><button id="loadModels" title="读取平台模型">↻</button></div></label><label>API 地址<input id="endpoint"></label><label>API Key<input id="apiKey" type="password" placeholder="仅保存在当前会话"></label><label>系统提示词<textarea id="prompt"></textarea></label><div class="buttons"><button id="testApi">测试连接</button><button class="primary" id="runNode">▶ 运行节点</button></div><pre id="output">尚未运行</pre></div></aside>
</div>
<dialog id="nodeDialog"><h3>添加节点</h3><div id="nodeCatalog"></div><button onclick="this.closest('dialog').close()">取消</button></dialog>
<dialog id="apiDialog"><h3>模型 API 中心</h3><p>密钥仅保存在当前浏览器会话，关闭浏览器后清除。</p><div id="apiList"></div><button onclick="this.closest('dialog').close()">完成</button></dialog>
<input id="projectFile" type="file" accept=".json" hidden><input id="assetFile" type="file" accept="image/*" hidden><div id="toast"></div><script src="app.js"></script></body></html>
