<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>成成的工作台</title><link rel="stylesheet" href="styles.css?v=6.8"></head>
<body><div id="app">
<nav class="rail"><div class="logo">成</div><button data-tab="project" title="项目">▣</button><button data-tab="assets" title="资产">◇</button><button data-tab="tasks" title="任务">≡</button><span></span><button id="settings" title="模型 API">⚙</button></nav>
<header><div><strong>成成的工作台</strong><small>自由搭建你的 AI 视频流水线</small></div><div class="header-actions"><span id="status">V6 · 本地自动保存</span><button id="import">导入</button><button id="export">导出</button><button class="primary" id="runAll">▶ 运行全部</button></div></header>
<aside class="left"><div class="tabs"><button class="on" data-tab="project">项目</button><button data-tab="assets">资产</button><button data-tab="tasks">任务</button></div>
  <section id="projectPanel"><div class="guide"><strong>从这里开始</strong><ol><li>双击画布，添加“TXT 文本”</li><li>写入想法，再添加 AI 文本节点</li><li>从右侧端口拖线连接下一步</li><li>选中 AI 节点，在右侧配置模型</li></ol></div><label>项目名称<input id="projectName" value="未命名视频项目"></label><label>核心创意<textarea id="idea" placeholder="一句话写清人物、目标和冲突……"></textarea></label><div class="row"><label>项目类型<select id="projectType"><option>短剧</option><option>广告</option><option>MV</option><option>纪录片</option><option>自定义</option></select></label><label>画面比例<select id="ratio"><option>16:9 横屏</option><option>9:16 竖屏</option><option>1:1 方形</option></select></label></div><div class="row"><label>集数<input id="episodes" type="number" min="1" value="1"></label><label>单集时长<input id="duration" value="3分钟"></label></div><label>统一视觉风格<input id="visualStyle" placeholder="例如：写实电影、低饱和冷色"></label></section>
  <section id="assetsPanel" hidden><div class="panel-title">角色参考图 <button id="addAsset">＋</button></div><div id="assetList" class="asset-list"></div></section>
  <section id="tasksPanel" hidden><div class="panel-title">任务状态</div><div id="taskList"></div></section>
</aside>
<main><div class="toolbar"><button id="addNode" class="primary">＋ 添加节点</button><button id="deleteNode">删除节点</button><button id="clearCanvas">清空画布</button><span></span><button id="zoomOut">−</button><b id="zoomText">100%</b><button id="zoomIn">＋</button></div><div id="canvasWrap"><svg id="wires"></svg><div id="canvas"></div><div class="hint">双击空白处添加节点 · 左右端口都能拖线 · 拖动标题移动节点 · 滚轮缩放</div></div></main>
<aside class="right" id="inspector"><div id="emptyInspect">选择一个节点后在这里编辑<br><small>双击画布可添加第一个节点</small></div><div id="nodeEditor" hidden><div class="eyebrow" id="nodeType"></div><h2 id="nodeTitle"></h2><label>节点名称<input id="nodeName"></label><div id="aiSettings"><label>平台<select id="provider"></select></label><label>模型<div class="inline"><select id="model"></select><button id="loadModels" title="读取平台模型">↻</button></div></label><label>API 地址<input id="endpoint"></label><label>API Key<input id="apiKey" type="password" placeholder="仅保存在当前会话"></label></div><label><span id="promptLabel">AI 工作要求</span><small class="help" id="promptHelp">告诉 AI 扮演什么角色、完成什么任务、按什么格式输出。</small><textarea id="prompt" placeholder="例如：你是专业编剧，根据输入生成三幕式剧本，只输出 JSON。"></textarea></label><div class="buttons"><button id="testApi">测试连接</button><button class="primary" id="runNode">▶ 运行节点</button></div><pre id="output">尚未运行</pre></div></aside>
</div>
<dialog id="nodeDialog"><h3 id="nodeDialogTitle">添加节点</h3><p id="nodeDialogHint">选择要添加的节点类型</p><div id="nodeCatalog"></div><button id="cancelNode">取消</button></dialog>
<dialog id="apiDialog"><h3>模型 API 中心</h3><p>密钥仅保存在当前浏览器会话，关闭浏览器后清除。</p><div id="apiList"></div><button onclick="this.closest('dialog').close()">完成</button></dialog>
<input id="projectFile" type="file" accept=".json" hidden><input id="assetFile" type="file" accept="image/*" hidden><div id="toast"></div><script src="app.js?v=6.8"></script></body></html>
